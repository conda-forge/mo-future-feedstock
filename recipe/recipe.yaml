schema_version: 1

context:
  name: mo-future
  version: "7.688.26259"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 0b93bdee65eac276246a57bfbecb062256edebdf5b22f76297aee8f343b364a9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mo_future
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  license: MPL-2.0
  license_file: LICENSE
  summary: More future! Make Python 2/3 compatibility a bit easier
  homepage: https://github.com/klahnakoski/mo-files

extra:
  recipe-maintainers:
    - xhochy
